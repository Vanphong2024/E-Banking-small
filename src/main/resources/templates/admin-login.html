<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Mini Banking</title>

    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>

<body>

    <div class="login-container">

        <div class="login-header">
            <div class="logo">MB</div>
            <h1>Mini Banking</h1>
            <p>Hệ thống quản trị ngân hàng</p>
        </div>

        <div class="login-card">

            <h2>Đăng nhập Admin</h2>
            <p class="subtitle">Vui lòng đăng nhập để tiếp tục</p>

            <!-- Thông báo đăng nhập thất bại -->
            <div class="error-message" th:if="${param.error}">
                Email hoặc mật khẩu không chính xác,
                hoặc tài khoản đã bị vô hiệu hóa.
            </div>

            <!-- Thông báo đăng xuất thành công -->
            <div class="success-message" th:if="${param.logout}">
                Bạn đã đăng xuất thành công.
            </div>

            <!-- Form đăng nhập -->
            <form th:action="@{/admin/login}" method="post">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập email Admin"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="login-btn">
                    Đăng nhập
                </button>

            </form>

        </div>

        <div class="login-footer">
            © 2026 Mini Banking. Admin Management System.
        </div>

    </div>

</body>
</html>
