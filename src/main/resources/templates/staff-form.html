<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm khách hàng | Mini Banking</title>
    <link rel="stylesheet" th:href="@{/css/staff-form.css}">
</head>
<body>

<div class="container">

    <h1>Thêm khách hàng</h1>

    <form th:action="@{/staff/create}"
          th:object="${user}"
          method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{userId}">
     <div class="form-group">
    <label for="username">Tên đăng nhập</label>
    <input type="text"
           id="username"
           th:field="*{username}"
           placeholder="Nhập username"
           required>
</div>

<div class="form-group">
    <label for="fullName">Họ tên</label>
    <input type="text"
           id="fullName"
           th:field="*{fullName}"
           placeholder="Nhập họ tên"
           required>
</div>

<div class="form-group">
    <label for="email">Email</label>
    <input type="email"
           id="email"
           th:field="*{email}"
           placeholder="Nhập email"
           required>
</div>

<div class="form-group">
    <label for="password">Mật khẩu</label>
    <input type="password"
           id="password"
           th:field="*{password}"
           placeholder="Nhập password"
           required>
</div>
        <button type="submit" class="btn-save">
            Lưu
        </button>

        <a th:href="@{/staff}" class="btn-back">
            Quay lại
        </a>

    </form>

</div>

</body>
</html>
