<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - E-Banking</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}">
</head>

<body>

<div class="login-page">

    <div class="login-container">

        <div class="bank-logo">
            MY BANK
        </div>

        <h1>Đăng nhập</h1>

        <p class="login-description">
            Đăng nhập vào hệ thống E-Banking
        </p>

        <form th:action="@{/login}"
              method="post">

            <div class="form-group">

                <label for="username">
                    Tên đăng nhập
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Nhập tên đăng nhập"
                       required>

            </div>


            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Nhập mật khẩu"
                       required>

            </div>


            <div th:if="${error}"
                 class="error-message">

                <span th:text="${error}">
                    Tên đăng nhập hoặc mật khẩu không đúng
                </span>

            </div>


            <button type="submit"
                    class="login-button">

                ĐĂNG NHẬP

            </button>

        </form>


        <div class="login-footer">

            <p>
                Hệ thống ngân hàng điện tử
            </p>

        </div>

    </div>

</div>

</body>
</html>
