<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản Staff</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="staff-management-page">
<main class="staff-form">
    <a th:href="@{/admin/staff}">Quay lại danh sách Staff</a>
    <h1>Tạo tài khoản Staff</h1>
    <p>Tài khoản mới chưa có quyền và chưa thể đăng nhập cho đến khi Admin cấp quyền.</p>

    <div class="form-error" th:if="${error}" th:text="${error}"></div>
    <div class="form-error" th:if="${param.csrfError}">
        Phiên làm việc đã hết hạn. Vui lòng nhập lại thông tin Staff.
    </div>
    <div class="form-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/admin/staff/create}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="fullName">Họ tên</label>
        <input id="fullName" name="fullName" type="text" required>

        <label for="email">Email đăng nhập</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" minlength="6" required>

        <button type="submit" class="btn-primary">Tạo Staff</button>
    </form>
</main>
</body>
</html>
