<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao dịch thành công | Mini Banking</title>
   <link rel="stylesheet" th:href="@{/css/transfer-success.css}">
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/ebanking}">
        <span class="brand-mark">◆</span>
        <span>MINI BANKING</span>
    </a>

    <span class="secure-label">
        <span class="secure-dot"></span>
      
    </span>
</header>

<main class="success-container">
    <section class="success-card">
        <div class="success-icon" aria-hidden="true">✓</div>

        <span class="eyebrow">HOÀN TẤT GIAO DỊCH</span>
        <h1>Chuyển tiền thành công!</h1>

        <p class="description">
            Giao dịch của bạn đã được thực hiện thành công.
            Số dư và lịch sử giao dịch đã được cập nhật.
        </p>

        <div class="success-note">
            <span class="note-check">✓</span>
            <span>Thông tin giao dịch đã được ghi nhận</span>
        </div>

        <div class="actions">
            <a th:href="@{/transactions/transfer}" class="continue-btn">
                <span>Tiếp tục giao dịch</span>
                <span aria-hidden="true">→</span>
            </a>

            <a th:href="@{/ebanking}" class="home-btn">
                Về màn hình chính
            </a>
        </div>
    </section>

  
</main>



</body>
</html>
