<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mini Banking</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-layout">

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Admin Dashboard</h1>
                <p>Manage staff accounts</p>
            </div>

            <div class="admin-profile">
                <div class="avatar">A</div>
                <span>Administrator</span>
                <form th:action="@{/admin/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">Đăng xuất</button>
                </form>
            </div>

        </header>


        <!-- Statistics -->
        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    👥
                </div>

                <div>
                    <span class="stat-label">Total Staff</span>

                    <!--
                        TODO:
                        Controller có thể truyền:
                        model.addAttribute("totalUsers", ...);
                    -->
                    <h2 th:text="${totalStaff != null ? totalStaff : 0}">
                        0
                    </h2>
                </div>

            </div>


        </section>


        <!-- Management -->
        <section class="dashboard-section">

            <div class="section-header">
                <div>
                    <h2>Management</h2>
                    <p>View and lock or unlock Staff accounts.</p>
                </div>
            </div>


            <div class="management-grid">

                <!-- Users -->
                <div class="management-card">

                    <div class="management-icon">
                        👥
                    </div>

                    <h3>Staff</h3>

                    <p>
                        View staff accounts and their current status.
                    </p>

                    <a th:href="@{/admin/staff}" class="btn btn-primary">
                        Manage Staff
                    </a>

                </div>



            </div>

        </section>

    </main>

</div>

</body>
</html>
